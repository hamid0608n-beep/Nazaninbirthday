<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>یکم استراحت 🎸💜</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;

            overflow-x: hidden;

            font-family: Tahoma, Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(202, 134, 255, 0.22),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 10% 55%,
                    rgba(255, 105, 210, 0.12),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 70%,
                    rgba(108, 77, 255, 0.16),
                    transparent 35%
                ),

                linear-gradient(
                    180deg,
                    #10051d 0%,
                    #1b0a2d 45%,
                    #0a0412 100%
                );

            display: flex;
            justify-content: center;
        }


        /* نورهای محیط */

        .ambient-light {
            position: fixed;

            width: 240px;
            height: 240px;

            border-radius: 50%;

            filter: blur(90px);

            pointer-events: none;

            opacity: 0.35;
        }

        .light-one {
            top: 15%;
            left: -100px;

            background:
                rgba(205, 110, 255, 0.45);
        }

        .light-two {
            bottom: 5%;
            right: -100px;

            background:
                rgba(118, 82, 255, 0.40);
        }


        /* ریسه */

        .fairy-lights {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 75px;

            pointer-events: none;

            z-index: 2;
        }

        .wire {

            position: absolute;

            top: 18px;
            left: -5%;

            width: 110%;
            height: 45px;

            border-bottom:
                2px solid
                rgba(70, 50, 90, 0.8);

            border-radius: 50%;
        }

        .bulb {

            position: absolute;

            width: 10px;
            height: 14px;

            border-radius: 50%;

            background: #ffd98a;

            box-shadow:
                0 0 10px
                rgba(255, 210, 120, 0.8),

                0 0 25px
                rgba(255, 170, 90, 0.45);

            animation:
                bulbGlow
                2.5s
                ease-in-out
                infinite;
        }

        .b1 {
            left: 8%;
            top: 42px;
        }

        .b2 {
            left: 22%;
            top: 52px;
            animation-delay: .5s;
        }

        .b3 {
            left: 36%;
            top: 58px;
            animation-delay: 1s;
        }

        .b4 {
            left: 50%;
            top: 60px;
            animation-delay: .2s;
        }

        .b5 {
            left: 64%;
            top: 58px;
            animation-delay: .8s;
        }

        .b6 {
            left: 78%;
            top: 52px;
            animation-delay: 1.4s;
        }

        .b7 {
            left: 92%;
            top: 42px;
            animation-delay: .4s;
        }

        @keyframes bulbGlow {

            0%,
            100% {
                opacity: .55;
                transform: scale(.9);
            }

            50% {
                opacity: 1;
                transform: scale(1.15);
            }
        }


        /* بادکنک‌ها */

        .balloon {

            position: fixed;

            width: 55px;
            height: 70px;

            border-radius:
                50% 50% 45% 45%;

            opacity: .18;

            filter: blur(.3px);

            pointer-events: none;
        }

        .balloon::after {

            content: "";

            position: absolute;

            width: 1px;
            height: 80px;

            background:
                rgba(255,255,255,.25);

            left: 50%;
            top: 68px;
        }

        .balloon-one {

            left: -15px;
            top: 25%;

            background: #d29cff;

            transform:
                rotate(-10deg);
        }

        .balloon-two {

            right: -15px;
            top: 34%;

            background: #ff9cdd;

            transform:
                rotate(10deg);
        }

        .balloon-three {

            left: 4%;
            bottom: 12%;

            width: 38px;
            height: 50px;

            background: #8fa7ff;

            opacity: .12;
        }


        /* ذرات */

        .spark {

            position: fixed;

            color: white;

            font-size: 10px;

            opacity: .5;

            pointer-events: none;

            animation:
                sparkle
                4s
                ease-in-out
                infinite;
        }

        .sp1 {
            top: 17%;
            left: 15%;
        }

        .sp2 {
            top: 24%;
            right: 18%;
            animation-delay: 1s;
        }

        .sp3 {
            top: 48%;
            left: 9%;
            animation-delay: 2s;
        }

        .sp4 {
            top: 55%;
            right: 10%;
            animation-delay: .7s;
        }

        .sp5 {
            bottom: 17%;
            left: 22%;
            animation-delay: 1.6s;
        }

        .sp6 {
            bottom: 25%;
            right: 25%;
            animation-delay: 2.3s;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: .15;
                transform: scale(.7);
            }

            50% {
                opacity: 1;
                transform: scale(1.5);
            }
        }


        /* محتوای صفحه */

        .page {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 520px;

            min-height: 100vh;
            min-height: 100dvh;

            padding:
                95px
                22px
                100px;

            display: flex;

            flex-direction: column;

            align-items: center;

            text-align: center;

            gap: 27px;
        }


        /* آهنگ */

        .music-section {

            width: 100%;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 13px;
        }

        .cat {

            width: 170px;
            height: 170px;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 100px;

            animation:
                catFloat
                3s
                ease-in-out
                infinite;

            filter:
                drop-shadow(
                    0 10px 20px
                    rgba(0,0,0,.45)
                );
        }

        .cat img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
    }
        @keyframes catFloat {

            0%,
            100% {
                transform:
                    translateY(0)
                    rotate(-2deg);
            }

            50% {
                transform:
                    translateY(-8px)
                    rotate(2deg);
            }
        }

        .music-title {

            font-size: 23px;

            font-weight: bold;

            line-height: 1.8;

            text-shadow:
                0 4px 15px
                rgba(0,0,0,.5);
        }

        .music-subtitle {

            font-size: 14px;

            color: #dbc7f4;

            line-height: 1.8;
        }


        /* پلیر */

        .music-player {

            width: 100%;

            max-width: 380px;

            padding: 15px 18px;

            border-radius: 20px;

            background:
                rgba(255,255,255,.07);

            border:
                1px solid
                rgba(255,255,255,.12);

            backdrop-filter: blur(14px);

            display: flex;

            align-items: center;

            gap: 14px;

            box-shadow:
                0 15px 35px
                rgba(0,0,0,.25);
        }

        .play-button {

            flex: 0 0 45px;

            width: 45px;
            height: 45px;

            border: none;

            border-radius: 50%;

            background: #c9a6ff;

            color: #35145f;

            font-size: 18px;

            cursor: pointer;

            display: flex;

            align-items: center;
            justify-content: center;

            transition:
                transform .2s ease,
                box-shadow .2s ease;
        }

        .play-button:hover {

            transform: scale(1.06);

            box-shadow:
                0 0 18px
                rgba(201,166,255,.35);
        }

        .play-button:active {

            transform: scale(.94);
        }

        .music-info {

            flex: 1;

            text-align: right;
        }

        .music-name {

            min-height: 18px;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 7px;
        }

        .progress {

            width: 100%;

            height: 5px;

            border-radius: 10px;

            background:
                rgba(255,255,255,.15);

            overflow: hidden;
        }

        .progress-bar {

            width: 0;

            height: 100%;

            border-radius: 10px;

            background: #c9a6ff;

            transition:
                width .12s linear;
        }

        audio {
            display: none;
        }


        /* جداکننده */

        .divider {

            width: 80%;

            height: 1px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(210,170,255,.45),
                    transparent
                );
        }
        /* =========================
           بخش کیک
        ========================== */

        .cake-section {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 14px;

            width: 100%;
        }

        .cake-title {

            font-size: 21px;

            font-weight: bold;

            line-height: 1.8;
        }

        .cake-subtitle {

            font-size: 14px;

            color: #dbc7f4;

            line-height: 1.8;
        }

        .cake {

            position: relative;

            width: 230px;
            height: 190px;

            margin-top: 8px;

            cursor: pointer;

            transition:
                transform .25s ease;

            user-select: none;

            -webkit-tap-highlight-color:
                transparent;
        }

        .cake:hover {
            transform: scale(1.03);
        }


        /* طبقه بالای کیک */
      
        .cake-top {
    position: absolute;

    left: 25px;
    top: 55px;

    width: 180px;
    height: 55px;

    border-radius: 15px 15px 10px 10px;

    background:
        radial-gradient(
            circle at 15% 35%,
            rgba(255,255,255,.18) 0 2px,
            transparent 3px
        ),
        radial-gradient(
            circle at 45% 70%,
            rgba(255,255,255,.12) 0 1.5px,
            transparent 2.5px
        ),
        radial-gradient(
            circle at 78% 30%,
            rgba(80,35,110,.12) 0 2px,
            transparent 3px
        ),
        linear-gradient(
            180deg,
            #d8bfff 0%,
            #bf99ee 45%,
            #a979df 100%
        );

    background-size:
        27px 24px,
        19px 20px,
        31px 28px,
        100% 100%;

    box-shadow:
        inset 0 5px 8px
        rgba(255,255,255,.12),

        inset 0 -8px 12px
        rgba(70,30,100,.12),

        0 8px 20px
        rgba(0,0,0,.35);

     z-index: 2;   
}

        /* خامه بالا */

        .cream {
    position: absolute;

    left: 25px;
    top: 43px;

    width: 180px;
    height: 30px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 18% 45%,
            rgba(255,255,255,.9) 0 3px,
            transparent 4px
        ),
        radial-gradient(
            circle at 52% 35%,
            rgba(245,235,255,.9) 0 3px,
            transparent 4px
        ),
        radial-gradient(
            circle at 82% 55%,
            rgba(255,255,255,.85) 0 3px,
            transparent 4px
        ),
        linear-gradient(
            180deg,
            #ffffff,
            #f4eaff
        );

    box-shadow:
        inset 0 -5px 8px
        rgba(190,150,230,.18),

        0 3px 8px
        rgba(0,0,0,.12);
}


        /* طبقه پایین */

        .cake-bottom {
    position: absolute;

    left: 5px;
    top: 105px;

    width: 220px;
    height: 65px;

    border-radius:
        12px 12px 18px 18px;

    background:
        radial-gradient(
            circle at 15% 30%,
            rgba(255,255,255,.14) 0 2px,
            transparent 3px
        ),
        radial-gradient(
            circle at 45% 65%,
            rgba(255,255,255,.09) 0 2px,
            transparent 3px
        ),
        radial-gradient(
            circle at 75% 35%,
            rgba(50,20,80,.12) 0 2px,
            transparent 3px
        ),
        linear-gradient(
            180deg,
            #b58ae9,
            #9a6bca 50%,
            #8152b7
        );

    background-size:
        28px 25px,
        24px 23px,
        30px 27px,
        100% 100%;

    box-shadow:
        inset 0 6px 10px
        rgba(255,255,255,.10),

        inset 0 -10px 14px
        rgba(55,20,80,.16),

        0 12px 25px
        rgba(0,0,0,.4);
}

        /* خامه پایین */

        .cream-bottom {
    position: absolute;

    left: 5px;
    top: 95px;

    width: 220px;
    height: 25px;

    border-radius: 50%;

    background:
        linear-gradient(
            180deg,
            #ffffff,
            #f3e7ff
        );

    box-shadow:
        inset 0 -5px 8px
        rgba(190,150,230,.18);
}

        /* تزئین */

        .decoration {

            position: absolute;

            top: 126px;
            left: 50%;

            transform:
                translateX(-50%);

            font-size: 18px;

            letter-spacing: 12px;
        }


        /* شمع‌ها */

        .candles {

            position: absolute;

            top: 0;
            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            gap: 20px;

            z-index: 5;
        }

        .candle {

            position: relative;

            width: 12px;
            height: 48px;

            border-radius: 5px;

            background:
                linear-gradient(
                    90deg,
                    #fff,
                    #d8bfff
                );
        }

        .flame {

            position: absolute;

            left: 50%;
            top: -27px;

            transform:
                translateX(-50%);

            width: 17px;
            height: 25px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle at 50% 65%,
                    #fff7b0,
                    #ffd35c 35%,
                    #ff8c42 70%,
                    transparent 72%
                );

            animation:
                flameMove
                .8s
                ease-in-out
                infinite
                alternate;
        }

        @keyframes flameMove {

            from {
                transform:
                    translateX(-50%)
                    scale(.9)
                    rotate(-3deg);
            }

            to {
                transform:
                    translateX(-50%)
                    scale(1.05)
                    rotate(3deg);
            }
        }


        /* خاموش شدن شمع */

        .cake.blown .flame {

            opacity: 0;

            transform:
                translateX(-50%)
                scale(0);

            transition:
                .35s ease;
        }


        /* دود */

        .smoke {

            position: absolute;

            left: 50%;
            top: -35px;

            transform:
                translateX(-50%);

            font-size: 18px;

            opacity: 0;
        }

        .cake.blown .smoke {

            opacity: .7;

            animation:
                smokeUp
                1.5s
                ease-out
                forwards;
        }

        @keyframes smokeUp {

            from {

                transform:
                    translateX(-50%)
                    translateY(0)
                    scale(.7);

                opacity: .7;
            }

            to {

                transform:
                    translateX(-50%)
                    translateY(-30px)
                    scale(1.3);

                opacity: 0;
            }
        }


        /* =========================
           خامه به سمت دوربین
        ========================== */

        .cream-piece {

            position: absolute;

            left: 50%;
            top: 65px;

            width: 18px;
            height: 18px;

            border-radius:
                50% 45% 55% 50%;

            background: white;

            box-shadow:
                0 0 10px
                rgba(255,255,255,.7),

                0 0 25px
                rgba(255,255,255,.25);

            opacity: 0;

            transform:
                translate(-50%, -50%)
                scale(.2);

            pointer-events: none;

            z-index: 50;
        }

        .cake.cream-shot .cream-piece {

            animation:
                creamToCamera
                .75s
                cubic-bezier(.15,.8,.2,1)
                forwards;
        }

        @keyframes creamToCamera {

            0% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(.2)
                    rotate(0deg);
            }

            15% {

                opacity: 1;
            }

            100% {

                opacity: 0;

                transform:
                    translate(-50%, -50%)
                    scale(8)
                    translateY(15px)
                    rotate(35deg);
            }
        }


        /* متن راهنما */

        .instruction {

            font-size: 13px;

            color: #cdb6ea;

            line-height: 1.8;
        }


        /* دکمه کادو */

        .next-button {

            border: none;

            cursor: pointer;

            padding:
                13px 25px;

            border-radius: 16px;

            background: #c9a6ff;

            color: #35145f;

            font-family: inherit;

            font-size: 14px;

            font-weight: bold;

            opacity: 0;

            pointer-events: none;

            transform:
                translateY(20px);

            transition:
                opacity .7s ease,
                transform .7s ease;
        }

        .next-button.show {

            opacity: 1;

            pointer-events: auto;

            transform:
                translateY(0);
        }


        /* لرزش نرم */

        body.screen-shake .page {

            animation:
                screenShake
                .4s
                cubic-bezier(.36,.07,.19,.97);
        }

        @keyframes screenShake {

            0%,
            100% {
                transform:
                    translateX(0);
            }

            15% {
                transform:
                    translateX(-6px);
            }

            30% {
                transform:
                    translateX(6px);
            }

            45% {
                transform:
                    translateX(-5px);
            }

            60% {
                transform:
                    translateX(4px);
            }

            75% {
                transform:
                    translateX(-2px);
            }
        }


        /* موبایل */

        @media (max-width:600px) {

            .page {

                padding:
                    90px
                    18px
                    120px;

                gap: 24px;
            }

            .cat {

                width: 180px;
                height: 180px;
            }

            .music-title {

                font-size: 21px;
            }

            .cake {

                transform:
                    scale(.9);
            }

            .cake:hover {

                transform:
                    scale(.9);
            }
        }


        /* فوکوس */

        .play-button:focus-visible,
        .next-button:focus-visible,
        .cake:focus-visible {

            outline:
                2px solid white;

            outline-offset: 4px;
        }

    </style>

</head>


<body>


    <!-- نور محیط -->

    <div class="ambient-light light-one"></div>

    <div class="ambient-light light-two"></div>


    <!-- ریسه -->

    <div class="fairy-lights">

        <div class="wire"></div>

        <div class="bulb b1"></div>
        <div class="bulb b2"></div>
        <div class="bulb b3"></div>
        <div class="bulb b4"></div>
        <div class="bulb b5"></div>
        <div class="bulb b6"></div>
        <div class="bulb b7"></div>

    </div>


    <!-- بادکنک‌ها -->

    <div class="balloon balloon-one"></div>

    <div class="balloon balloon-two"></div>

    <div class="balloon balloon-three"></div>


    <!-- ذرات -->

    <div class="spark sp1">✦</div>

    <div class="spark sp2">✧</div>

    <div class="spark sp3">✦</div>

    <div class="spark sp4">✧</div>

    <div class="spark sp5">✦</div>

    <div class="spark sp6">✧</div>


    <main class="page">


        <!-- آهنگ -->

        <section class="music-section">


            <div class="cat">
                <img
                    src="catmusic.gif"
                    alt="musician cat"
                    >
            </div>


            <div class="music-title">
                فعلاً بیا یکم آهنگ گوش بده 🎸💜
            </div>


            <div class="music-subtitle">
                تا یکم انرژی بگیری :)
            </div>


            <div class="music-player">


                <button
                    class="play-button"
                    id="playButton"
                    type="button"
                    aria-label="پخش یا توقف آهنگ"
                >
                    ▶
                </button>


                <div class="music-info">


                    <div
                        class="music-name"
                        id="musicName"
                    >
                        یه آهنگ برای تو 🎧
                    </div>


                    <div class="progress">

                        <div
                            class="progress-bar"
                            id="progressBar"
                        ></div>

                    </div>


                </div>


                <audio
                    id="audio"
                    preload="metadata"
                >

                    <source
                        src="music.mp3"
                        type="audio/mpeg"
                    >

                </audio>


            </div>


        </section>


        <div class="divider"></div>


        <!-- کیک -->

        <section class="cake-section">


            <div class="cake-title">
                حالا چشماتو ببند... ✨
            </div>


            <div class="cake-subtitle">
                یه آرزو کن و بعد شمع‌ها رو فوت کن 🎂
            </div>


            <div
                class="cake"
                id="cake"
                role="button"
                tabindex="0"
                aria-label="خاموش کردن شمع‌ها"
            >


                <div class="cake-pieces">

                    <span
                        class="cream-piece"
                    ></span>

                </div>


                <div class="candles">


                    <div class="candle">

                        <div class="flame"></div>

                    </div>


                    <div class="candle">

                        <div class="flame"></div>

                    </div>


                    <div class="candle">

                        <div class="flame"></div>

                    </div>


                </div>


                <div class="cream"></div>

                <div class="cake-top"></div>

                <div class="cake-bottom"></div>
                
                <div class="cream-bottom"></div>

                <div class="decoration">
                    ✦ ✦ ✦
                </div>

                <div class="smoke">
                    ☁️
                </div>


            </div>


            <div
                class="instruction"
                id="instruction"
            >

                وقتی آرزوت رو کردی،
                روی کیک بزن 🫳

            </div>


            <button
                class="next-button"
                id="nextButton"
                type="button"
            >

        ببخشید بی کادو/: متن رو بخون

            </button>


        </section>


    </main>

    <script>


        /* =========================
           پلیر آهنگ
        ========================== */

        const audio =
            document.getElementById("audio");

        const playButton =
            document.getElementById("playButton");

        const progressBar =
            document.getElementById("progressBar");

        const musicName =
            document.getElementById("musicName");


        let musicAvailable = true;


        audio.addEventListener(
            "error",
            () => {

                musicAvailable = false;

                musicName.textContent =
                    "آهنگ هنوز اضافه نشده 🎧";

                playButton.textContent =
                    "♪";

            }
        );


        playButton.addEventListener(
            "click",
            async () => {

                if (!musicAvailable) {

                    musicName.textContent =
                        "فایل music.mp3 رو کنار این صفحه قرار بده 🎧";

                    return;
                }


                try {

                    if (audio.paused) {

                        await audio.play();

                    } else {

                        audio.pause();

                    }

                } catch (error) {

                    musicName.textContent =
                        "برای پخش، فایل music.mp3 باید کنار page2.html باشد 🎧";

                }

            }
        );


        audio.addEventListener(
            "play",
            () => {

                playButton.textContent =
                    "❚❚";

            }
        );


        audio.addEventListener(
            "pause",
            () => {

                playButton.textContent =
                    "▶";

            }
        );


        audio.addEventListener(
            "ended",
            () => {

                playButton.textContent =
                    "▶";

                progressBar.style.width =
                    "0%";

            }
        );


        audio.addEventListener(
            "timeupdate",
            () => {

                if (
                    !audio.duration ||
                    !Number.isFinite(audio.duration)
                ) {

                    return;

                }


                const percent =
                    (
                        audio.currentTime /
                        audio.duration
                    ) * 100;


                progressBar.style.width =
                    `${percent}%`;

            }
        );


        /* =========================
           افکت کیک
        ========================== */

        const cake =
            document.getElementById("cake");

        const nextButton =
            document.getElementById("nextButton");

        const instruction =
            document.getElementById("instruction");


        function blowCandles() {


            /* جلوگیری از اجرای دوباره */

            if (
                cake.classList.contains("blown")
            ) {

                return;

            }


            /* خاموش شدن شمع‌ها */

            cake.classList.add("blown");


            instruction.textContent =
                "آرزو کردی حالا باید کادو میبود ولی بیا بهت تبریچ بگممم:) 🎁";


            /* خامه به سمت دوربین */

            setTimeout(
                () => {

                    cake.classList.add(
                        "cream-shot"
                    );

                },
                220
            );


            /* لرزش صفحه */

            setTimeout(
                () => {

                    document.body.classList.add(
                        "screen-shake"
                    );


                    setTimeout(
                        () => {

                            document.body.classList.remove(
                                "screen-shake"
                            );

                        },
                        400
                    );

                },
                380
            );


            /*
                نمایش دکمه و
                اسکرول خیلی نرم
            */

            setTimeout(
                () => {

                    nextButton.classList.add(
                        "show"
                    );


                    setTimeout(
                        () => {

                            nextButton.scrollIntoView({

                                behavior: "smooth",

                                block: "center"

                            });

                        },
                        150
                    );


                },
                900
            );

        }


        /* کلیک روی کیک */

        cake.addEventListener(
            "click",
            blowCandles
        );


        /* پشتیبانی از Enter و Space */

        cake.addEventListener(
            "keydown",
            (event) => {

                if (
                    event.key === "Enter" ||
                    event.key === " "
                ) {

                    event.preventDefault();

                    blowCandles();

                }

            }
        );


        /* =========================
           دکمه صفحه بعد
        ========================== */

        nextButton.addEventListener(
            "click",
            () => {

                window.location.href =
                    "page3.html";

            }
        );


    </script>


</body>

</html>
